[package]
name = "mlacker"
version = "0.1.0"
module_paths = ["modules"]

[dependencies]
vst3sdk = { git = "https://github.com/steinbergmedia/vst3sdk.git", rev = "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96", submodules = true, build = "none", spinner = false }

[tool.mlang]
min_mlang_version = "0.2.0"
build_dir = "build"
deps_dir = "build/deps"

# build.sh fills these from mlacker.conf (written by bootstrap.sh); override with
# `--option key=value` when running `mlang pkg` directly.
# mlang_root: MLang checkout that provides build/mlang, build/libmlang_std.a and
# stdlib/include. The tui/dsp modules come from the compiler's own tree.
[tool.mlang.options]
mlang_root = "subprojects/mlang"
bin_dir = "~/.local/bin"
plugin_dir = "~/.local/plugins/VST3"
plugins = "mla_verb mla_distortion mla_delay mla_eq mla_filter mla_drum mla_sampler mla_stutter mla_juno_chorus mla_gated_verb mla_limiter mla_vocoder mla_speech mla_06 mla_08"

[[task]]
name = "prepare"
workdir = "{{root}}"
supported_hosts = ["darwin"]
unsupported_message = "mlacker currently uses macOS AUHAL audio output"
commands = ["mkdir -p {{build_dir}}/obj", "cmake --build {{option.mlang_root}}/build --target mlang_std -j4"]

[[task]]
name = "compile-main"
phase = "compile"
workdir = "{{root}}"
depends_on = ["prepare"]
language = "mlang"
source = "src/main.mla"
output = "{{build_dir}}/obj/main.o"
compile_only = true
opt_level = "O2"
compiler_flags = ["-Wno-unwrap", "-Wno-colon-if"]

[[task]]
name = "configure"
workdir = "{{root}}"
depends_on = ["compile-main"]
commands = ["cmake -S {{root}} -B {{build_dir}}/cmake -DCMAKE_BUILD_TYPE=Release -DVST3_SDK_ROOT={{deps_dir}}/vst3sdk -DMLACKER_MAIN_OBJECT={{build_dir}}/obj/main.o -DMLANG_ROOT={{option.mlang_root}}"]

[[task]]
name = "build"
phase = "build"
workdir = "{{root}}"
depends_on = ["configure"]
commands = ["cmake --build {{build_dir}}/cmake -j4"]

[[task]]
name = "run"
workdir = "{{root}}"
depends_on = ["build"]
log_output = false
shell = ["exec {{build_dir}}/cmake/bin/mlacker"]

# MLang unit tests for mlacker_ui; fixtures are read relative to the repository root.
[[task]]
name = "unit-test"
workdir = "{{root}}"
depends_on = ["prepare"]
commands = ["{{option.mlang_root}}/build/mlang --tests tests"]

[[task]]
name = "test"
workdir = "{{root}}"
depends_on = ["build", "unit-test"]
commands = ["ctest --test-dir {{build_dir}}/cmake --output-on-failure"]

[[task]]
name = "install"
print = "[mlacker] Installing mlacker to {{option.bin_dir}}"
workdir = "{{root}}"
depends_on = ["build"]
shell = [
  "set -e",
  "bin_dir={{option.bin_dir}}",
  "mkdir -p \"$bin_dir\"",
  "cp -f {{build_dir}}/cmake/bin/mlacker \"$bin_dir/mlacker\"",
  "chmod +x \"$bin_dir/mlacker\"",
  "codesign --force --sign - \"$bin_dir/mlacker\"",
  "echo \"Installed $bin_dir/mlacker\""
]

# The plugins share one CMake tree (plugins/CMakeLists.txt) so the VST3 SDK,
# fetched once above, is compiled once: configure-plugins -> build-vst3sdk ->
# compile-plugins (each plugin's MLang DSP object) -> build-plugins.
[[task]]
name = "configure-plugins"
workdir = "{{root}}"
depends_on = ["prepare"]
shell = [
  "set -e",
  "cmake -S plugins -B {{build_dir}}/plugins -DCMAKE_BUILD_TYPE=Release -DVST3_SDK_ROOT={{deps_dir}}/vst3sdk -DMLANG_ROOT={{option.mlang_root}} -DMLA_PLUGINS=\"{{option.plugins}}\""
]

[[task]]
name = "build-vst3sdk"
print = "[mlacker] Building the VST3 SDK for the plugins"
workdir = "{{root}}"
depends_on = ["configure-plugins"]
commands = ["cmake --build {{build_dir}}/plugins --target sdk -j4"]

[[task]]
name = "compile-plugins"
print = "[mlacker] Compiling the Mla plugin DSP objects"
workdir = "{{root}}"
depends_on = ["build-vst3sdk"]
shell = [
  "set -e",
  "mlang_root=$(cd \"{{option.mlang_root}}\" && pwd)",
  "for plugin in {{option.plugins}}; do \"$mlang_root/build/mlang\" pkg --config plugins/$plugin/mlang.toml run compile-dsp --option mlang_root=\"$mlang_root\"; done"
]

[[task]]
name = "build-plugins"
print = "[mlacker] Building the Mla VST3 plugins"
workdir = "{{root}}"
depends_on = ["compile-plugins"]
commands = ["cmake --build {{build_dir}}/plugins --target mla_plugins -j4"]

[[task]]
name = "test-plugins"
workdir = "{{root}}"
depends_on = ["build-plugins"]
commands = [
  "cmake --build {{build_dir}}/plugins --target mla_plugin_tests -j4",
  "ctest --test-dir {{build_dir}}/plugins --output-on-failure"
]

[[task]]
name = "install-plugins"
print = "[mlacker] Installing the Mla VST3 plugins to {{option.plugin_dir}}"
workdir = "{{root}}"
depends_on = ["build-plugins"]
shell = [
  "set -e",
  "plugin_dir={{option.plugin_dir}}",
  "mkdir -p \"$plugin_dir\"",
  "for bundle in {{build_dir}}/plugins/VST3/Release/*.vst3; do dest=\"$plugin_dir/$(basename \"$bundle\")\"; rm -rf \"$dest\"; cp -R \"$bundle\" \"$dest\"; codesign --force --sign - \"$dest\"; echo \"Installed $dest\"; done"
]

[[task]]
name = "install-all"
print = "[mlacker] Installed mlacker and the Mla VST3 plugins"
workdir = "{{root}}"
depends_on = ["install", "install-plugins"]
commands = ["echo mlacker install-all completed"]
