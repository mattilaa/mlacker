[package]
name = "mla_distortion"
version = "0.1.0"

[dependencies]
vst3sdk = { git = "https://github.com/steinbergmedia/vst3sdk.git", rev = "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96", submodules = true, build = "none", spinner = false }

[tool.mlang]
min_mlang_version = "0.2.0"
build_dir = "build"
deps_dir = "build/deps"

# MLang checkout providing build/mlang and build/libmlang_std.a. mlacker's
# build.sh passes an absolute path; the default assumes subprojects/mlang.
[tool.mlang.options]
mlang_root = "../../subprojects/mlang"

[[task]]
name = "prepare"
print = "[mla_distortion] Preparing build tree and MLang runtime archive"
workdir = "{{root}}"
commands = [
  "mkdir -p {{build_dir}}/obj {{build_dir}}/cmake",
  "cmake --build {{option.mlang_root}}/build --target mlang_std -j4"
]

[[task]]
name = "compile-dsp"
phase = "compile"
print = "[mla_distortion] Compiling the MLang distortion DSP object"
workdir = "{{root}}"
depends_on = ["prepare"]
language = "mlang"
source = "src/mla_distortion_dsp.mla"
output = "{{build_dir}}/obj/mla_distortion_dsp.o"
compile_only = true
opt_level = "O2"

[[task]]
name = "configure"
print = "[mla_distortion] Configuring the CMake project for the VST3 effect bundle"
workdir = "{{root}}"
depends_on = ["compile-dsp"]
commands = [
  "cmake -S {{root}} -B {{build_dir}}/cmake -DCMAKE_BUILD_TYPE=Release -DVST3_SDK_ROOT={{deps_dir}}/vst3sdk -DMLANG_DSP_OBJECT={{build_dir}}/obj/mla_distortion_dsp.o -DMLANG_STD_LIBRARY={{option.mlang_root}}/build/libmlang_std.a -DMLANG_ROOT={{option.mlang_root}}"
]

[[task]]
name = "build"
phase = "build"
print = "[mla_distortion] Building the Mla Distortion .vst3 bundle"
workdir = "{{root}}"
depends_on = ["configure"]
commands = [
  "cmake --build {{build_dir}}/cmake --target MlaDistortion -j4"
]
