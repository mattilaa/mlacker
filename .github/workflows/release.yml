name: Release

# Builds the macOS installer (.pkg) with mlacker, the Mla VST3 plugins and the
# MLang toolchain from MLang's v0.4.4 release, and attaches it to a GitHub
# Release.
#
# version.txt holds MAJOR.MINOR.PATCH. Tags vMAJOR.MINOR.PATCH[.BUILD]
# build that exact version. Manual builds make drafts, optionally with the run
# number; release_tag can rebuild an existing tag. A published tag release
# proposes the next patch version as a separate reviewable PR.
#
# Unsigned unless these repository secrets exist:
#   MACOS_CERTIFICATES_P12           base64 .p12 with the Developer ID
#                                    Application and Installer certificates
#   MACOS_CERTIFICATES_PASSWORD      its password
#   MACOS_CODESIGN_IDENTITY          "Developer ID Application: Name (TEAMID)"
#   MACOS_INSTALLER_IDENTITY         "Developer ID Installer: Name (TEAMID)"
# and notarized when these exist too:
#   APPLE_NOTARY_KEY                 base64 App Store Connect API key (.p8)
#   APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_number:
        description: Append the run number to a manual draft version
        type: boolean
        default: false
      release_tag:
        description: Optional existing tag to rebuild (for example v0.3.1)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  macos-pkg:
    name: macOS installer
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      MLANG_TUI_NO_HARDWARE: "1"
      # mlacker links OpenSSL statically, so it runs without Homebrew.
      MLACKER_STATIC_OPENSSL: "1"

    steps:
      - name: Check out mlacker
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Version
        id: version
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            args+=(--release-tag "$GITHUB_REF_NAME")
          elif [ -n "$RELEASE_TAG_INPUT" ]; then
            args+=(--release-tag "$RELEASE_TAG_INPUT")
            if [ "$BUILD_NUMBER_INPUT" = "true" ]; then
              echo "::error::release_tag and build_number cannot be combined"
              exit 1
            fi
          elif [ "$BUILD_NUMBER_INPUT" = "true" ]; then
            args+=(--build-number "$GITHUB_RUN_NUMBER")
          fi
          python3 scripts/ci_version.py "${args[@]}" --github

      - name: Install MLang build dependencies
        run: |
          brew install llvm openssl@3 zstd z3 rapidjson ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm);$(brew --prefix openssl@3);$(brew --prefix zstd);$(brew --prefix z3);$(brew --prefix rapidjson)" >> "$GITHUB_ENV"

      - name: Bootstrap (MLang v0.4.4 as subprojects/mlang, full toolchain)
        id: mlang
        run: |
          ./bootstrap.sh --mlang-subproject \
            --mlang-repo https://github.com/mattilaa/mlang.git \
            --mlang-branch v0.4.4 \
            --mlang-toolchain --no-agent-notes --no-build -y
          echo "commit=$(git -C subprojects/mlang rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git -C subprojects/mlang log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          echo "MLang: $(git -C subprojects/mlang log -1 --format='%h %s')" >> "$GITHUB_STEP_SUMMARY"

      - name: Build MLang, mlacker and plugins
        run: ./build.sh --all -j 3

      - name: Verify binary version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: test "$(build/cmake/bin/mlacker --version)" = "mlacker $EXPECTED_VERSION"

      - name: Import signing certificates
        id: signing
        env:
          P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "No signing certificates; building an unsigned package."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificates.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificates.p12"
          echo "enabled=1" >> "$GITHUB_OUTPUT"

      - name: Build the installer package
        env:
          MLACKER_CODESIGN_IDENTITY: ${{ steps.signing.outputs.enabled && secrets.MACOS_CODESIGN_IDENTITY || '' }}
          MLACKER_INSTALLER_SIGN_IDENTITY: ${{ steps.signing.outputs.enabled && secrets.MACOS_INSTALLER_IDENTITY || '' }}
        run: packaging/macos/build_pkg.sh --version "${{ steps.version.outputs.version }}" --out build/release

      - name: Notarize
        if: steps.signing.outputs.enabled
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$NOTARY_KEY" ]; then
            echo "No notary key; the package is signed but not notarized."
            exit 0
          fi
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          for package in build/release/*.pkg; do
            xcrun notarytool submit "$package" --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
            xcrun stapler staple "$package"
          done
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: mlacker-${{ steps.version.outputs.version }}-macos-arm64
          path: build/release/*.pkg
          if-no-files-found: error

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MLANG_COMMIT: ${{ steps.mlang.outputs.commit }}
          MLANG_SUBJECT: ${{ steps.mlang.outputs.subject }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "mlacker $VERSION for macOS (Apple silicon), with the Mla VST3 plugins and the MLang toolchain"
            echo "(MLang v0.4.4 at [\`$MLANG_COMMIT\`](https://github.com/mattilaa/mlang/commit/$MLANG_COMMIT): $MLANG_SUBJECT)."
            echo
            echo "Open \`mlacker-$VERSION-macos-arm64.pkg\`. The installer asks where to install each part"
            echo "(defaults: \`~/.local\` for MLang, \`~/.local/bin\` for mlacker, \`~/.local/plugins/VST3\` for the plugins)"
            echo "and offers to add the tool directories to your PATH."
            if [ -z "$SIGNED" ]; then
              echo
              echo "The package is not signed: if macOS refuses to open it, right-click it and choose Open,"
              echo "or allow it under System Settings > Privacy & Security."
            fi
          } > "$notes"
          flags=""
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && flags="--draft"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/release/*.pkg --clobber
          else
            gh release create "$TAG" build/release/*.pkg --title "mlacker $VERSION" \
              --notes-file "$notes" --target "$GITHUB_SHA" $flags
          fi

  bump-version:
    name: Propose next patch version
    needs: macos-pkg
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    concurrency:
      group: release-version-bump
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          fetch-depth: 0

      - name: Prepare version bump
        run: python3 scripts/bump_release_version.py --release-tag "$RELEASE_TAG" --yes

      - name: Open confirmation pull request
        shell: bash
        run: |
          if git diff --quiet -- version.txt mlang.toml; then
            exit 0
          fi
          branch="release/bump-after-$RELEASE_TAG"
          existing=$(gh pr list --state all --head "$branch" --base "$DEFAULT_BRANCH" --json url --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then
            echo "Version bump already proposed: $existing"
            echo "Review the existing PR; a closed PR can be reopened or the local script used."
            exit 0
          fi
          # Recover if an earlier run pushed the branch but failed to create the PR.
          remote_branch=$(git ls-remote --heads origin "refs/heads/$branch")
          if [[ -n "$remote_branch" ]]; then
            git fetch origin "refs/heads/$branch"
            git diff --exit-code FETCH_HEAD -- version.txt mlang.toml
          else
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add version.txt mlang.toml
            git commit -m "Bump patch version after $RELEASE_TAG"
            git push origin "$branch"
          fi
          cat > "$RUNNER_TEMP/version-bump-pr.md" <<EOF
          Release $RELEASE_TAG has been published and its assets uploaded.

          Increment version.txt and synchronize mlang.toml by one patch version for subsequent development builds.

          Review the diff and merge this PR to confirm the bump.
          EOF
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "Bump patch version after $RELEASE_TAG" \
            --body-file "$RUNNER_TEMP/version-bump-pr.md"
